<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LSP | Locksmith Security Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background-image: url('https://i.imgur.com/mvztspH.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    footer {
      background: rgba(0, 0, 0, 0.9);
      padding: 3rem 2rem;
      text-align: center;
      width: 100%;
    }

    .contact-tabs {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .contact-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #FFD700;
      transition: all 0.3s;
    }

    .contact-tab:hover {
      color: #fff;
    }

    .contact-icon {
      font-size: 2rem;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #FFD700;
      border-radius: 50%;
      transition: all 0.3s;
    }

    .contact-tab:hover .contact-icon {
      background: #FFD700;
      color: #000;
    }

    .contact-label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .footer-bottom {
      font-size: 0.85rem;
      color: #FFD700;
      border-top: 1px solid #FFD700;
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 768px) {
      .contact-tabs {
        gap: 1rem;
      }

      footer {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>

<section class="hero">
  <footer>
    <div class="contact-tabs">
      <a href="https://wa.me/27722350002" class="contact-tab" target="_blank">
        <div class="contact-icon">💬</div>
        <span class="contact-label">WhatsApp</span>
      </a>
      
      <a href="https://maps.app.goo.gl/WezVn4JTE8Q69oV3A" class="contact-tab" target="_blank">
        <div class="contact-icon">📍</div>
        <span class="contact-label">Google Profile</span>
      </a>
      
      <a href="mailto:lspsales@mweb.co.za" class="contact-tab">
        <div class="contact-icon">✉️</div>
        <span class="contact-label">Email</span>
      </a>
    </div>

    <div class="footer-bottom">
      <p>Set and Forget | Theme by WeMustCreate | local optimized</p>
    </div>
  </footer>
</section>

</body>
</html>
